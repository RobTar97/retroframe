version: 2

updates:
  # Gradle dependencies. Kept monthly on purpose — this app targets old hardware and
  # every bump needs checking against minSdk 22 before it is merged.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"

    # These are blocked by minSdk 22 / compileSdk 36, not by inertia. Each was tested
    # and fails the build; see the CEILING notes in gradle/libs.versions.toml. Without
    # these ignores Dependabot reopens the same impossible PRs every month, which trains
    # everyone to stop reading dependency PRs at all.
    ignore:
      # Requires minSdk 23 — would drop Android 5.1, the project's whole premise.
      - dependency-name: "com.google.android.material:material"
        versions: [ ">=1.13.0" ]
      - dependency-name: "androidx.media3:*"
        versions: [ ">=1.7.0" ]
      - dependency-name: "androidx.savedstate:*"
        versions: [ ">=1.4.0" ]
      - dependency-name: "androidx.lifecycle:*"
        versions: [ ">=2.9.0" ]
      - dependency-name: "androidx.fragment:*"
        versions: [ ">=1.8.6" ]
      - dependency-name: "com.github.bumptech.glide:*"
        versions: [ ">=5.0.0" ]
      # ktlint 14 adds wrapping rules that split single-parameter constructors and two-link
      # call chains across lines. Adopting it means disabling rule after rule to protect a
      # style that is deliberate — see the ktlint section of .editorconfig.
      - dependency-name: "org.jlleitschuh.gradle.ktlint"
        versions: [ ">=14.0.0" ]
      # Requires compileSdk 37.
      - dependency-name: "androidx.core:core-ktx"
        versions: [ ">=1.17.0" ]
      # Gradle 9 needs AGP 8.13+; revisit together, not separately.
      - dependency-name: "gradle"
        versions: [ ">=9.0" ]
      # AGP 9.x requires Gradle 9.5+, which in turn needs a newer Kotlin plugin. Tested:
      # CI fails with "Minimum supported Gradle version is 9.5.0". The whole toolchain
      # moves together or not at all.
      - dependency-name: "com.android.application"
        versions: [ ">=9.0" ]
      - dependency-name: "com.android.tools.build:gradle"
        versions: [ ">=9.0" ]

  # GitHub Actions used by CI
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
