# Memory is deliberately modest. A build for an app that targets 1 GB tablets should not
# need a 16 GB workstation to compile: Gradle, the Kotlin daemon and lint each fork their
# own JVM, and the earlier 3 GB heap exhausted a machine with 16 GB installed.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m

# Single-module project, so parallel execution buys nothing and only adds memory pressure.
org.gradle.caching=true
org.gradle.configureondemand=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
