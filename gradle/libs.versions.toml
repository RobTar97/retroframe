# ============================================================================
# CEILINGS — read before bumping anything
#
# RetroFrame supports minSdk 22 (Android 5.1) on purpose: that is the oldest
# version worth rescuing a tablet from, and it is the whole premise of the
# project. AndroidX has since moved its own floor to minSdk 23, so several
# libraries below are pinned BELOW their latest release and cannot be raised
# without abandoning Android 5.1.
#
# Anything marked CEILING has been tested and fails. Don't re-litigate it
# without deciding the minSdk question first — see docs/KNOWN_ISSUES.md.
# ============================================================================

[versions]
agp = "8.9.1"                # CEILING: Gradle 9.x needs AGP 8.13+; 8.9.1 crashes on it
kotlin = "2.4.10"

# AndroidX
coreKtx = "1.16.0"           # CEILING: 1.19.0 requires compileSdk 37
appcompat = "1.7.1"
material = "1.12.0"          # CEILING: 1.14.0 requires minSdk 23
constraintlayout = "2.2.1"
fragment = "1.8.5"           # CEILING: 1.8.9 pulls savedstate 1.4.0, which needs minSdk 23
lifecycle = "2.8.7"          # CEILING: 2.11.0 pulls savedstate 1.4.0, which needs minSdk 23
viewpager2 = "1.1.0"
recyclerview = "1.4.0"
documentfile = "1.1.0"
media3 = "1.6.1"             # CEILING: 1.10.1 requires minSdk 23

# Third party
glide = "5.0.9"
photoview = "2.3.0"
coroutines = "1.11.0"

# Test
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
robolectric = "4.16.1"       # Tests pin sdk = [35]; SDK 36 shadows require Java 21

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
photoview = { module = "com.github.chrisbanes:PhotoView", version.ref = "photoview" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-test-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
